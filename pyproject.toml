[project]
name = "django_robots_registry"
version = "1.0.0"
description = "A robots.txt view for Django built around independently-registered providers."
readme = "README.md"
requires-python = ">=3.14.4"
license = {text = "BSD-3-Clause"}
authors = [{name = "Michael Glorioso", email = "michael.glorioso@glotronic.net"}]
dependencies = ["Django>=6.1.1"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mike-glorioso/django-robots-registry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.setuptools.package-data]
django_robots_registry = ["py.typed"]
